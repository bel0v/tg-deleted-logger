# Pinned resolver for the sandboxed tglogger service.
#
# systemd/tg-logger.service bind-mounts this file over /etc/resolv.conf inside
# the service's namespace. That keeps the egress allow-list machine-agnostic:
# the userbot always resolves via these fixed public servers, never via the
# host's own resolver. So the same unit works unchanged on any host regardless
# of its DNS setup.
#
# (GramJS talks to Telegram DCs by IP over MTProto, so DNS is barely used at
# all — this is mostly belt-and-suspenders. If you drop the two DNS entries
# from IPAddressAllow in the unit, drop this bind mount too.)
nameserver 1.1.1.1
nameserver 1.0.0.1
